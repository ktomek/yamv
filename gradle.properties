# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# TODO: remove both once KSP supports AGP 9 built-in Kotlin (https://kotl.in/gradle/agp-built-in-kotlin)
# WARNING: These two properties generate AGP deprecation warnings ("option setting is deprecated") but
# cannot be removed until KSP fully supports AGP 9 built-in Kotlin. Keeping them intentionally.
# Related: org.jetbrains.kotlin.android plugin deprecation in yamv-hilt and app/hilt also cannot be
# fixed without first removing these flags.
android.builtInKotlin=false
android.newDsl=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false
VERSION_NAME=0.1.0

# === Known third-party warnings that cannot be fixed without upstream upgrades ===
# 1. "ReportingExtension.file(String) deprecated" — from Detekt plugin internals (DetektPlugin.kt:28).
#    Fix: upgrade Detekt to a version that uses getBaseDirectory().file() instead.
# 2. "kotlin.multiplatform + com.android.library deprecated" — KGP warns that com.android.library
#    should be replaced with com.android.kotlin.multiplatform.library for AGP 9+.
#    Affects: :yamv-retainer, :yamv-koin. Fix: migrate to the new AGP KMP plugin (separate task).
# 3. "KLIB resolver: same unique_name found in more than one library" — dependency version conflict
#    between Compose Multiplatform and AndroidX in :app:koin native targets. Third-party issue.