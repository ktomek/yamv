site_name: YAMV
site_description: Yet Another MVI Framework — Kotlin-first MVI for Android & KMP
site_author: Krzysztof Tomek
site_url: https://ktomek.github.io/yamv
repo_url: https://github.com/ktomek/yamv
repo_name: ktomek/yamv
edit_uri: edit/main/site-docs/

docs_dir: site-docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Features Guide: features.md
  - Code Generation: code-generation.md
  - Multiplatform: multiplatform.md
  - Changelog: changelog.md
